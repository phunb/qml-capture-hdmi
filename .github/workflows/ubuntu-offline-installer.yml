name: Ubuntu USB installer

on:
  push:
    branches: [dev-ubuntu]
  workflow_dispatch:

concurrency:
  group: ubuntu-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools qtimageformats
          archives: qtbase qtdeclarative qtsvg qttools
          cache: true
          cache-key-prefix: qt-6.8.3-linux-kiosk-icu73

      - name: Build offline installer
        env:
          HDMI_KIOSK_VERSION: "1.0.0"
        run: |
          chmod +x scripts/*.sh scripts/*.py deploy/linux/*.sh
          if [[ -z "${HDMI_KIOSK_QT:-}" && -n "${QT_ROOT_DIR:-}" ]]; then
            export HDMI_KIOSK_QT="$QT_ROOT_DIR"
          fi
          if [[ -z "${HDMI_KIOSK_QT:-}" ]] && command -v qmake >/dev/null; then
            export HDMI_KIOSK_QT="$(qmake -query QT_INSTALL_PREFIX)"
          fi
          echo "HDMI_KIOSK_QT=${HDMI_KIOSK_QT:-}"
          if [[ -n "${HDMI_KIOSK_QT:-}" ]]; then
            export LD_LIBRARY_PATH="${HDMI_KIOSK_QT}/lib:${LD_LIBRARY_PATH:-}"
          fi
          ./scripts/package-ubuntu-deb.sh

      - name: USB instructions
        run: |
          SHA="${GITHUB_SHA::7}"
          {
            echo "HDMI Kiosk — bộ cài USB (Ubuntu 24.04 amd64)"
            echo "Commit: ${SHA}  (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo
            echo "1. Copy file .run vào USB."
            echo "2. Cắm USB vào mini-PC (không cần mạng)."
            echo "3. Chạy:"
            echo "     sudo ./hdmi-kiosk-offline_1.0.0_amd64.run"
            echo "     sudo reboot"
            echo "4. Máy tự login user kiosk và mở app toàn màn hình."
          } > dist/CAI-USB.txt
          cat dist/CAI-USB.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdmi-kiosk-ubuntu-usb
          path: |
            dist/hdmi-kiosk-offline_*.run
            dist/hdmi-kiosk-offline_*.tar.gz
            dist/CAI-USB.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tải về USB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=ubuntu-kiosk
          NOTES=dist/CAI-USB.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/hdmi-kiosk-offline_*.run dist/hdmi-kiosk-offline_*.tar.gz dist/CAI-USB.txt --clobber
            gh release edit "$TAG" --title "Bộ cài Ubuntu USB (dev-ubuntu)" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" dist/hdmi-kiosk-offline_*.run dist/hdmi-kiosk-offline_*.tar.gz dist/CAI-USB.txt \
              --title "Bộ cài Ubuntu USB (dev-ubuntu)" \
              --notes-file "$NOTES" \
              --prerelease
          fi
